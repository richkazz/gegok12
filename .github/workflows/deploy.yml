name: CI/CD Deployment Workflow

on:
  push:
    branches:
      - host
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, zip, exif, pcntl, bcmath, gd, intl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env.example for Testing
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Test Suite
        run: |
          php artisan test tests/Feature/AuthenticationTest.php tests/Feature/SchoolStatusLifecycleTest.php tests/Feature/TeacherStatusLifecycleTest.php

      - name: Install Node Dependencies & Build Production Assets
        run: |
          npm ci || npm install
          npm run production

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}

      - name: Copy Deployment Configuration to Remote Server
        if: ${{ secrets.SERVER_IP != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.prod.yml,nginx.conf,php.ini"
          target: "apps/gego12"

      - name: Deploy to Remote Server via SSH
        if: ${{ secrets.SERVER_IP != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_LOWER: ${{ env.REPO_LOWER }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: GITHUB_TOKEN,REPO_LOWER,GITHUB_ACTOR
          script: |
            set -e
            echo "Starting deployment on server..."
            TARGET_DIR="apps/gego12"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            export GITHUB_REPOSITORY_LOWER="${REPO_LOWER}"

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            docker pull ghcr.io/${GITHUB_REPOSITORY_LOWER}:latest

            docker compose -f docker-compose.prod.yml down || true
            docker compose -f docker-compose.prod.yml up -d

            docker exec school_app php artisan migrate --force || true
            docker exec school_app php artisan config:cache || true
            docker exec school_app php artisan route:cache || true
            docker exec school_app php artisan view:cache || true

            echo "Deployment completed successfully!"
